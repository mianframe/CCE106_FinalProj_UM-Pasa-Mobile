name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Create Environment Variables
        run: |
          cat << 'EOF' > .env
          EXPO_PUBLIC_SUPABASE_URL=https://qtboywnuopgpgmspxxng.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF0Ym95d251b3BncGdtc3B4eG5nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2NTI1MTksImV4cCI6MjEwNjIyODUxOX0.R7lPKh3SZhePIUCbv8sow1sGR7zMsmtuiFczg8_1rRk
          EOF

      - name: 🛠️ Prebuild native Android project
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Compile Standalone Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          
          mkdir -p output_apk
          RAW_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found compiled release APK at: $RAW_APK"
          cp "$RAW_APK" output_apk/UM-Pasa.apk
          
          # Generate custom release keystore and resign with apksigner for clean device installation
          keytool -genkeypair -v -storetype PKCS12 -keystore release.keystore -alias umpasa -keyalg RSA -keysize 2048 -validity 10000 -storepass umpasa123 -keypass umpasa123 -dname "CN=UMPasa, OU=Tagum, O=UM, L=Tagum, ST=Davao, C=PH"
          
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/apksigner sign --ks release.keystore --ks-pass pass:umpasa123 --ks-key-alias umpasa --key-pass pass:umpasa123 --out output_apk/UM-Pasa-Release.apk output_apk/UM-Pasa.apk
          cp output_apk/UM-Pasa-Release.apk output_apk/UM-Pasa.apk

      - name: 🚀 Upload Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: UM-Pasa-Android-APK
          path: android/output_apk/UM-Pasa.apk
          if-no-files-found: error
